name: Build BungeeCord

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build BungeeCord
        run: |
          git clone https://github.com/SpigotMC/BungeeCord.git source
          cd source
          chmod +x ./mvnw
          ./mvnw -B package
