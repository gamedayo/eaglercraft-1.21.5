
name: Build BungeeCord

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Checkout BungeeCord
        uses: actions/checkout@v4
        with:
          repository: SpigotMC/BungeeCord
          path: source
      - name: Build
        run: |
          cd source
          mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: BungeeCord
          path: source/bootstrap/target/*.jar
